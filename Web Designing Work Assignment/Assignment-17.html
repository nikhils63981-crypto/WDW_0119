<html>
    <head>
        <title>Form Attributes and Input Validation</title>
    </head>
    <body>

        <form action="submit.php" method="post">

            <input type="text" name="fullname" placeholder="Full name" required>
            <br><br>

            <input type="email" name="email" placeholder="you@college.edu" required>
            <br><br>

            <input type="text" name="mobile" placeholder="10-digit mobile" required>
            <br><br>

            <input type="password" name="password" placeholder="Min 4 characters"
            minlength="4" required>
            <br><br>

            <input type="number" name="age" placeholder="Age"
            min="17" max="30" required>
            <br><br>

            <button type="submit">Register</button>

        </form>

    </body>
</html>
